<script>
/*
  那一天，我走上勞山 — HTML 版（圖檔使用 assets；雲端紀錄需連線）
  圖檔放在 HTML 同層的 assets/：可在 ASSET 配置中替換。
  教師密碼僅防止學生誤觸；純前端無法提供真正的安全性。
*/
const CONFIG = {
  teacherPassword: 'shika2026',
  googleScriptUrl: 'https://script.google.com/macros/s/AKfycbwUuwDOHppfYRdGt1alMgJuzfUg5Pjtv6V1w6b5rfmpf370Owcx1b59k9wmq4fjBjux/exec', // 串接 Google Apps Script Web App 後，填入網址即可自動上傳完成紀錄。
  title: '那一天，我走上勞山',
  storageKey: 'laoshan-learning-game-v1'
};
const ASSET = {
  mountains:'assets/bg-guilin-mountains.png', monastery:'assets/bg-daoist-monastery.png',
  map:'assets/bg-daily-task-map.png', hall:'assets/bg-wooden-hall.png',
  wang:'assets/wangsheng-expressions.png', master:'assets/daoshi-expressions.png', disciples:'assets/disciples-expressions.png',
  endings:{
    embarrassed:'assets/ending-01-embarrassed.png',
    home:'assets/ending-02-home.png',
    modest:'assets/ending-03-modest.png',
    stay:'assets/ending-04-stay.png',
    master:'assets/ending-05-master.png'
  }
};
const QUOTE = '「宜早寢，勿誤樵蘇。」\n「歸宜潔持，否則不驗。」';
const ENDINGS = {
  embarrassed:{label:'結局一｜硬壁之前',title:'我以為自己學會了',art:ASSET.endings.embarrassed,fallback:ASSET.hall,
    text:'我帶著穿牆之術匆匆下山，急著向旁人證明自己在勞山的奇遇。話才說滿，我便在眾目之下撞上硬壁；笑聲響起時，我先怪師父沒有說清，卻不願回想那句「歸宜潔持」。我學到的只是幾句口訣，沒有學會自持；我追求的是別人的驚嘆，並不是修行。這一撞，讓我明白：把捷徑當成本事，終會在最想炫耀的地方碰壁。',class:'warn'},
  home:{label:'結局二｜帶著問題下山',title:'我先回家了',art:ASSET.endings.home,fallback:ASSET.mountains,
    text:'身體的疲憊已超過我能承受的範圍。我坦白向師父告別，沒有討要法術，也沒有假裝自己不怕苦。下山時，我仍覺得山路漫長，卻開始知道：離開不必然等於失敗，若能誠實承認目前的局限，便能重新準備。勞山沒有給我神奇的捷徑，卻留下了一個問題：下一次面對枯燥的基本功，我願意多堅持一天嗎？',class:'flat'},
  modest:{label:'結局三｜一點微光',title:'我帶走了一盞小燈',art:ASSET.endings.modest,fallback:ASSET.monastery,
    text:'臨行前，師父沒有傳授驚人的法術，只教我一個安定心神的小法門。我沒有急著驗證，也沒有向人宣揚。回家後，每當心浮氣躁，我便想起山中劈柴、掃葉、挑水的節奏。它不能讓我穿牆，卻讓我在想走捷徑時停下來，重新看清眼前該做的事。真正留下來的，不是可以炫耀的奇術，而是一點願意耐住無聊的微光。',class:'good'},
  stay:{label:'結局四｜仍在山中',title:'我選擇再修一程',art:ASSET.endings.stay,fallback:ASSET.map,
    text:'我沒有立刻成為厲害的人，也沒有等到每天都有奇景。只是當落葉再次鋪滿石階，我能先拿起掃帚；當木頭紋理難辨，我願意慢慢調整斧頭。師兄說，修行不是把辛苦變得好玩，而是明白辛苦也有它的位置。我於是留在勞山繼續學習。道力仍然很少，但我不再把「快」誤認成「成」。山中的每一天，都成為我新的起點。',class:'good'},
  master:{label:'結局五｜山長，心亦長',title:'我終成勞山道士',art:ASSET.endings.master,fallback:ASSET.monastery,
    text:'多年後，松風仍過舊觀。我記得初上山時，自己總在問何時能學到法術；如今有新弟子問我捷徑，我便先交給他一把斧頭、一支掃帚與兩只水桶。並不是要他受苦，而是盼他在重複裡看見自己的心：急躁、比較、虛榮，或願意專注的一瞬。若能守住那一瞬，才有真正的道力。我沒有忘記那道硬壁，因為它曾替我指出回頭的方向。',class:'magic'}
};
const TASKS = {
  wood:{name:'砍柴',icon:'🪓',desc:'順著木紋落斧，替廚房備好柴薪。',speaker:'採樵師兄',portrait:'brother',lines:[
    ['旁白','霧還掛在松枝上，斧頭已落到木樁。'],['採樵師兄','先看木紋，再落斧；力氣不是越大越好。'],['王生','一段木頭而已，怎麼還要看這麼久？'],['採樵師兄','急著砍快，往往得多砍幾次。'],['旁白','我盯著裂開的木紋，想到道觀裡那些還沒學會的法術。']],
    choices:[
      {text:'照著木紋慢慢劈，先把這一捆柴完成。',effect:{body:11,mind:1,dao:1},notice:'你把注意力收回斧頭與木紋；道力悄悄累積。',kind:'steadfast'},
      {text:'問師兄能否用法術把整堆木頭瞬間劈好。',effect:{body:2,mind:7,shortcut:1},notice:'你省下一點力氣，心裡卻更急著求快。',kind:'shortcut'},
      {text:'先找一根最細的枝條交差，剩下明日再說。',effect:{body:4,mind:5,shortcut:1},notice:'你暫時輕鬆了，但任務做得不完整。',kind:'shortcut'}]

let memoryStore = {records:[],settings:{}}, storageAvailable = true;
function loadStore(){
  if(!storageAvailable)return memoryStore;
  try{
    const parsed=JSON.parse(localStorage.getItem(CONFIG.storageKey));
    if(parsed && Array.isArray(parsed.records))memoryStore={...parsed,settings:parsed.settings||{}};
  }catch{storageAvailable=false}
  return memoryStore;
}
function saveStore(s){
  memoryStore=s;
  if(!storageAvailable)return false;
  try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(s));return true}
  catch{storageAvailable=false;return false}
}
function store(){return loadStore()}

  app.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><section class="modal"><button class="close" onclick="closeModal()">×</button><h2>教師後臺｜本機統計</h2><p>此瀏覽器有 <b>${records.length}</b> 筆遊戲紀錄（不含串接測試）。這裡不是全班雲端統計；跨裝置的紀錄請到你的私人 Google 試算表查看。舊版紀錄不會自動補傳。</p><p>這個前端密碼僅避免誤觸，不能保護機密資料。試算表請維持限制存取。</p><section>${counts.map(([k,n])=>`<div class="chart-row"><span>${ENDINGS[k].label}</span><div class="bar"><i style="width:${n/total*100}%"></i></div><b>${n} 人</b></div>`).join('')}</section><div class="backend-grid"><section class="backend-card"><h3>資料匯出</h3><p>下載本機 CSV，包含紀錄編號與傳送狀態。</p><button class="secondary" onclick="exportCSV()">下載作答紀錄 CSV</button></section><section class="backend-card"><h3>Google 試算表同步</h3><p>已內建本次接收網址。僅傳送班級、座號、代號、時間、結局與紀錄編號，不傳送逐題選擇。首次使用請先送出虛構測試資料。</p><button id="cloudTestButton" class="secondary" onclick="testCloudSync()">送出測試資料</button><p id="cloudTestStatus" aria-live="polite"></p><button id="retryPendingButton" class="secondary" onclick="retryPendingRecords()">重試未確認紀錄</button></section></div><h3>最近完成紀錄</h3>${records.length?`<div class="table-scroll"><table class="record-table"><thead><tr><th>玩家</th><th>完成時間</th><th>結局</th><th>耗時</th><th>同步</th></tr></thead><tbody>${records.slice(-8).reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.end)}</td><td>${esc(r.endingLabel)}</td><td>${fmtTime(r.duration)}</td><td>${r.syncStatus==='confirmed'?'已確認':r.payload?'未確認':'舊版未同步'}</td></tr>`).join('')}</tbody></table></div>`:'<p>尚無完成紀錄。</p>'}<button class="secondary danger" onclick="clearRecords()">清除本機統計</button></section></div>`);
  renderSyncUI();
}
function exportCSV(){
  const records=store().records.filter(r=>!r.isCloudTest);
  const cols=['紀錄編號','班級－座號－代號','開始時間','完成時間','最終結局','同步狀態'];
  const rows=records.map(r=>[r.recordId||'',r.id,r.start,r.end,r.endingLabel,r.syncStatus==='confirmed'?'已確認':r.payload?'未確認':'舊版未同步']);
  const csv='\ufeff'+[cols,...rows].map(row=>row.map(v=>{let text=String(v??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='勞山道士_作答紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function saveGoogleUrl(){alert('此版本使用內建接收網址；如需更換，請更新 HTML 中的 CONFIG.googleScriptUrl。')}
function clearRecords(){
  if(syncInFlight.size||retrying){alert('正在傳送資料，請等候完成後再清除。');return}
  if(confirm('確定清除此裝置的紀錄嗎？尚未確認送達的資料也會失去重試機會。這不會刪除 Google 試算表中的資料。')){
    const s=store();s.records=[];saveStore(s);lastCompletedRecord=null;testRecord=null;closeModal();teacherPanel();
  }
}
function showRules(){app.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><section class="modal"><button class="close" onclick="closeModal()">×</button><h2>修行提示</h2><p><b>45 天修行</b>以每三天一回合壓縮呈現；每回合自由選兩項日課，再完成一段觀察、協作或調息的修行插曲。第 6、15、24、33、42 日有關鍵劇情，第 45 日進入最終去留抉擇。</p><p><b>心理疲憊值</b>來自無聊、比較與急躁；奇異法術或連續踏實完成日課，可能使它下降。<br><b>身體疲憊值</b>會因日課上升；連續五日出勤，上限升至 120；超過十日後，王生逐漸適應山中節奏。<br><b>道力值</b>以 100 為量尺；四十五日內最多只能累積 20。唯有踏實完成日課、克制速成、避免炫耀才能累積。</p><p>數值以低／中／高呈現，並於每回合結算；請留意箭頭，而非只追求單一數字。</p></section></div>`)}
function showCast(){app.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><section class="modal"><button class="close" onclick="closeModal()">×</button><h2>勞山人物誌</h2><p><b>王生</b>：世家子弟，嚮往道術；他要學的，是不把「快」誤認為「成」。<br><b>道士</b>：仙風道骨、識人明敏；以日課教人修心，而非只傳奇術。</p><div class="cast-grid">${[['0%','採樵師兄','沉穩，教王生順著木紋做事。'],['33.33%','掃地師兄','安靜，知道重複也能有清明。'],['66.66%','挑水師兄','爽朗，帶人練出穩定的步子。'],['100%','小師弟','好奇，提醒王生別只看奇景。']].map(([x,n,d])=>`<div class="cast-card"><div class="disciple" style="--x:${x}"></div><b>${n}</b><small>${d}</small></div>`).join('')}</div></section></div>`)}
intro();
